[project]
name = "beancount-sqlite"
version = "0.1.0"
description = "Load Beancount ledger data into a queryable SQLite database"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = ["beancount>=3.2.0"]

[project.scripts]
beancount-sqlite = "beancount_sqlite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beancount_sqlite"]

[dependency-groups]
dev = ["ruff", "ty", "sqlfluff"]

[tool.ruff.lint]
ignore = ["COM812"]
